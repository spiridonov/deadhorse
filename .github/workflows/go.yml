name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod's floor ("1.24.0") plus whatever Go currently calls stable --
        # the oldest version this module claims to support, and the newest
        # one a user actually building it today would have.
        go-version: [ '1.24', 'stable' ]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v --race ./...

    - name: Vet
      run: go vet -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # v6 of this action (and its own `latest`) only ever resolves a
        # golangci-lint v1.x binary, which can't parse .golangci.yml's v2
        # config schema ("version: \"2\"", linters.settings,
        # linters.exclusions.*) at all -- v7+ is "golangci-lint v2 only" per
        # its own release notes. Pin the tool version explicitly too,
        # rather than trusting "latest" to mean what it sounds like.
        version: v2.14.0

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # A single native-arch build, no push -- this is the authoritative
    # check that the Dockerfile and .dockerignore actually still agree with
    # the module's package layout (go.test's
    # TestDockerBuildContextCoversCmdDeadhorseDeps catches the common
    # "forgot a !dir/ exception" case fast and without Docker, but this is
    # what would have actually failed, on the very next push instead of on
    # the next release tag). The real release workflow
    # (docker-release.yml) does the full multi-arch build+push; that's not
    # worth repeating on every PR.
    - name: Build Docker image (no push)
      run: docker build -t deadhorse:ci-check .
