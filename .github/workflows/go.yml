name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod's floor ("1.24.0") plus whatever Go currently calls stable --
        # the oldest version this module claims to support, and the newest
        # one a user actually building it today would have.
        go-version: [ '1.24', 'stable' ]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v --race ./...

    - name: Vet
      run: go vet -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
